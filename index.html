<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #faf8ef;
            padding-top: 20px;
        }
        h1 {
            font-size: 48px;
            color: #776e65;
            margin-bottom: 10px;
        }
        .score {
            font-size: 24px;
            color: #776e65;
            margin-bottom: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
            background-color: #bbada0;
            padding: 10px;
            border-radius: 6px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: #cdc1b4;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            color: #776e65;
        }
        /* 不同数字的背景色 */
        .num2 { background: #eee4da; }
        .num4 { background: #ede0c8; }
        .num8 { background: #f2b179; color: white; }
        .num16 { background: #f59563; color: white; }
        .num32 { background: #f67c5f; color: white; }
        .num64 { background: #f65e3b; color: white; }
        .num128 { background: #edcf72; color: white; }
        .num256 { background: #edcc61; color: white; }
        .num512 { background: #edc850; color: white; }
        .num1024 { background: #edc53f; color: white; }
        .num2048 { background: #edc22e; color: white; }
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 30px;
            border-radius: 10px;
            font-size: 32px;
            text-align: center;
            display: none;
        }
        .game-over button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            background: #f65e3b;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>2048</h1>
    <div class="score">分数: <span id="score">0</span></div>
    <div class="container" id="container"></div>
    <div class="game-over" id="gameOver">
        游戏结束！<br>
        <button onclick="restartGame()">重新开始</button>
    </div>

    <script>
        // 游戏数据
        let grid = [];
        let score = 0;
        const container = document.getElementById('container');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('gameOver');

        // 初始化游戏
        function initGame() {
            grid = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            updateScore();
            addRandomNum();
            addRandomNum();
            renderGrid();
            gameOverEl.style.display = 'none';
        }

        // 渲染棋盘
        function renderGrid() {
            container.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const num = grid[i][j];
                    if (num > 0) {
                        cell.textContent = num;
                        cell.classList.add(`num${num}`);
                    }
                    container.appendChild(cell);
                }
            }
        }

        // 随机生成2或4
        function addRandomNum() {
            const emptyCells = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) emptyCells.push([i, j]);
                }
            }
            if (emptyCells.length === 0) return;
            const [x, y] = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            grid[x][y] = Math.random() < 0.9 ? 2 : 4;
        }

        // 更新分数
        function updateScore() {
            scoreEl.textContent = score;
        }

        // 向左移动
        function moveLeft() {
            let moved = false;
            for (let i = 0; i < 4; i++) {
                let row = grid[i].filter(val => val !== 0);
                for (let j = 0; j < row.length - 1; j++) {
                    if (row[j] === row[j + 1]) {
                        row[j] *= 2;
                        score += row[j];
                        row.splice(j + 1, 1);
                    }
                }
                while (row.length < 4) row.push(0);
                if (row.toString() !== grid[i].toString()) moved = true;
                grid[i] = row;
            }
            return moved;
        }

        // 向右移动
        function moveRight() {
            let moved = false;
            for (let i = 0; i < 4; i++) {
                let row = grid[i].filter(val => val !== 0);
                for (let j = row.length - 1; j > 0; j--) {
                    if (row[j] === row[j - 1]) {
                        row[j] *= 2;
                        score += row[j];
                        row.splice(j - 1, 1);
                        j--;
                    }
                }
                while (row.length < 4) row.unshift(0);
                if (row.toString() !== grid[i].toString()) moved = true;
                grid[i] = row;
            }
            return moved;
        }

        // 向上移动
        function moveUp() {
            let moved = false;
            for (let j = 0; j < 4; j++) {
                let col = [];
                for (let i = 0; i < 4; i++) col.push(grid[i][j]);
                col = col.filter(val => val !== 0);
                for (let i = 0; i < col.length - 1; i++) {
                    if (col[i] === col[i + 1]) {
                        col[i] *= 2;
                        score += col[i];
                        col.splice(i + 1, 1);
                    }
                }
                while (col.length < 4) col.push(0);
                for (let i = 0; i < 4; i++) {
                    if (grid[i][j] !== col[i]) moved = true;
                    grid[i][j] = col[i];
                }
            }
            return moved;
        }

        // 向下移动
        function moveDown() {
            let moved = false;
            for (let j = 0; j < 4; j++) {
                let col = [];
                for (let i = 0; i < 4; i++) col.push(grid[i][j]);
                col = col.filter(val => val !== 0);
                for (let i = col.length - 1; i > 0; i--) {
                    if (col[i] === col[i - 1]) {
                        col[i] *= 2;
                        score += col[i];
                        col.splice(i - 1, 1);
                        i--;
                    }
                }
                while (col.length < 4) col.unshift(0);
                for (let i = 0; i < 4; i++) {
                    if (grid[i][j] !== col[i]) moved = true;
                    grid[i][j] = col[i];
                }
            }
            return moved;
        }

        // 判断游戏是否结束
        function isGameOver() {
            // 有空位
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) return false;
                }
            }
            // 相邻可合并
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (j < 3 && grid[i][j] === grid[i][j + 1]) return false;
                    if (i < 3 && grid[i][j] === grid[i + 1][j]) return false;
                }
            }
            return true;
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            let moved = false;
            switch(e.key) {
                case 'ArrowLeft': moved = moveLeft(); break;
                case 'ArrowRight': moved = moveRight(); break;
                case 'ArrowUp': moved = moveUp(); break;
                case 'ArrowDown': moved = moveDown(); break;
            }
            if (moved) {
                addRandomNum();
                renderGrid();
                updateScore();
                if (isGameOver()) {
                    setTimeout(() => {
                        gameOverEl.style.display = 'block';
                    }, 300);
                }
            }
        });

        // 重新开始
        function restartGame() {
            initGame();
        }

        // 页面加载完成初始化
        window.onload = initGame;
    </script>
</body>
</html>
